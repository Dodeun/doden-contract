# DATABASE_URL handed to a service whose Manifest declares no database - a
# Project nobody created a role for, reaching for a secret that is not in its
# Doppler project.
#
# The `data` network is deliberately absent, so `networks` stays quiet and
# this fixture fires exactly the rule it is named after.
name: ${PROJECT_SLUG:?PROJECT_SLUG is not set}

services:
  backend:
    image: ${IMAGE_REPO_PREFIX}-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: https://${APP_HOST}/api
      DATABASE_URL:
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${PROJECT_SLUG:?}-api.rule=Host(`${APP_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.${PROJECT_SLUG:?}-api.entrypoints=websecure
      - traefik.http.routers.${PROJECT_SLUG:?}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.${PROJECT_SLUG:?}-api.middlewares=${PROJECT_SLUG:?}-api-strip
      - traefik.http.middlewares.${PROJECT_SLUG:?}-api-strip.stripprefix.prefixes=/api
      - traefik.http.services.${PROJECT_SLUG:?}-api.loadbalancer.server.port=4000

  frontend:
    image: ${IMAGE_REPO_PREFIX}-frontend:${IMAGE_TAG:?IMAGE_TAG is not set}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.${PROJECT_SLUG:?}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${PROJECT_SLUG:?}.entrypoints=websecure
      - traefik.http.routers.${PROJECT_SLUG:?}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.${PROJECT_SLUG:?}.loadbalancer.server.port=80

networks:
  web:
    external: true
