# Any tag: the agent can make one that is not v*.
name: Deploy a tagged release
on:
  push:
    tags: ['*']
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Send the release to the host
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: bash deploy/request.sh
