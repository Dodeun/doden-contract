# An anchor: GitHub reads it, and the checker's reader does not.
name: Tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps: &steps
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.test.yml run --rm test
  again:
    runs-on: ubuntu-latest
    steps: *steps
