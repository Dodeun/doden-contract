# After the tests, on the code of the branch that ran them: a branch's code beside the webhook.
name: Report on the tests
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash scripts/notify.sh
